<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/base.html"
        },
        "script": {
            "custom": [
                "resources/scripts/toc.js"
            ]
        }
    }
    ---
    [% template title %]
    <title>[[ page:transform($context?doc?fragment, map { "mode": "title" }, $context?doc?odd || ".odd")/string() ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [% if exists($context?doc) %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ page:collection-breadcrumbs($context) ]]
                <li>[[ page:transform($context?doc?content, map { "mode": "breadcrumb" }, $context?doc?odd || ".odd") ]]</li>
            </ul>
        </nav>
    </li>
    [% endif %]
    [% endtemplate %]

    [% template before %]
    [% if $context?features?toc?enabled and exists($context?doc)%]
    <h5>
        <pb-i18n key="document.contents">Contents</pb-i18n>
    </h5>
    [% if ($context?view-static or $context?defaults?view-static) and $context?defaults?data-static %]
    <pb-load class="toc" url="[[$context-path]]/[[$context?defaults?data-static]]/[[$context?doc?path]]/toc.html" expand="expand" auto="auto" subscribe="toc" emit="toc" load-once="load-once">
        <pb-i18n key="dialogs.loading">Loading</pb-i18n>
    </pb-load>
    [% else %]
    <pb-load class="toc" url="api/document/{doc}/contents?lang=[[page:resolve-language($context)]]&amp;target=transcription&amp;icons=true[[ if ($context?features?toc?collapse) then '&amp;collapse=true' else '' ]]" expand="expand" src="document1" subscribe="toc" emit="toc" load-once="load-once" auto="auto"><pb-i18n key="dialogs.loading">Loading</pb-i18n></pb-load>
    [% endif %]
    [% endif %]

    [% if $context?features?toc-odd?enabled and exists($context?doc) %]
        <pb-view src="document1" subscribe="none" view="single" emit="transcription" disable-history="disable-history">
            <pb-param name="mode" value="toc"/>
            <pb-param name="mode-sub" value="toc-odd"/>
        </pb-view>
    [% endif %]
    [% endtemplate %]

    <main>
        [% block above-content %][% endblock %]
        <!-- Content block -->
        [% block content %][% endblock %]
        [% block below-content %][% endblock %]
    </main>
    [% if exists($context?doc) %]
    <pb-document id="document1" path="[[ $context?doc?path ]]" odd="[[ $context?doc?odd ]]" view="[[ $context?doc?view ]]" root-path="[[ $config:data-root ]]" source-view="[[ $page:EXIDE ]]"/>
    [% endif %]
</template>
